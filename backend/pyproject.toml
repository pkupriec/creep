[project]
name = "cognitive-graph"
version = "0.1.0"
description = "Local graph proxy for Hermes and external Ollama"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "jsonschema==4.26.0",
  "referencing==0.37.0+cg.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.uv.sources]
referencing = { path = "vendor/referencing-0.37.0+cg.1-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
